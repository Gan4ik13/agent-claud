services:
  - type: web
    name: agent-claud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: SELF_URL
        value: https://agent-claud.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.0"
